[package]
name = "chatspeed-gpui-observer"
version = "2.1.3"
edition = "2021"
publish = false

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]

[[bin]]
name = "chatspeed-gpui-observer"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
chatspeed-runtime-client = { path = "../client" }
gpui-kit = { version = "=0.10.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
clap = { version = "4", features = ["derive"] }
