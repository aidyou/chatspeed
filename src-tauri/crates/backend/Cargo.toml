[package]
name        = "chatspeed-runtime-backend"
version     = "2.0.17"
description = "Desktop-free ChatSpeed runtime backend assembled from the canonical application modules"
authors     = ["Ezool Network"]
edition     = "2021"
publish     = false
autobins    = false

# This package physically owns the canonical runtime modules under its `src/`
# tree: the database, AI, tool, MCP, capability, workflow, ccproxy, sensitive
# and environment layers, the runtime data-command dispatcher and the built-in
# agent synchronization. The desktop links this crate and owns only its
# transport and UI adapters, so there is no second implementation.
[lib]
name    = "chatspeed_runtime_backend"
path    = "src/lib.rs"
doctest = false

[features]
# Legacy marker for remaining conditional source guards. Neither the runtime
# nor the desktop dependency enables it; desktop adapters live in their own
# crate and the backend closure must never link Tauri, Wry or GTK.
desktop = []

[dependencies]
chatspeed-contracts = { path = "../contracts" }
aes-gcm          = "0.10"
anyhow           = "1.0.102"
async-trait      = "0.1.89"
axum             = "0.8.9"
base64           = "0.22.1"
bytes            = "1.11.1"
chrono           = { version = "0.4.44", features = ["serde"] }
dashmap          = "6.1.0"
dirs             = "6.0"
futures          = { version = "0.3.32", features = ["std"] }
futures-util     = "0.3.32"
glob             = "0.3.3"
globset          = "0.4.18"
hex              = "0.4"
html-escape      = "0.2.13"
http             = "1.3.1"
ignore           = "0.4.25"
image            = "0.25.10"
indexmap         = { version = "2.14.0", features = ["serde"] }
json_value_merge = "2.0.1"
lazy_static      = "1.5"
libc             = "0.2"
locale_config    = "0.3.0"
log              = "0.4.29"
lru              = "0.18.0"
md5              = "0.7"
memchr           = "2.8.0"
parking_lot      = "0.12.5"
phf              = { version = "0.13.1", features = ["macros"] }
# The runtime is the single owner of the interactive user terminal PTY (U-7).
# The version matches the workspace root's `portable-pty` so both crates link
# the same PTY backend; this crate never links Tauri, Wry or GTK.
portable-pty     = "0.9.0"
rand             = "0.10.1"
regex            = "1.12.3"
reqwest          = { version = "0.13.3", features = ["json", "stream", "multipart", "cookies"] }
rmcp             = { version = "3.4.0", features = [
    "client",
    "reqwest",
    "transport-child-process",
    "tower",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rusqlite         = { version = "0.39.0", features = ["bundled", "backup"] }
rust-i18n        = "4.0.0"
scraper          = "0.25.0"
semver           = "1.0.28"
serde            = { version = "1.0.228", features = ["derive"] }
serde_json       = "1.0.149"
serde_yaml       = "0.9.34-deprecated"
sha2             = "0.11.0"
shellexpand      = "3.1.0"
shlex            = "1.3.0"
strum            = { version = "0.28.0", features = ["derive"] }
tempfile         = "3.27.0"
thiserror        = "2.0.18"
time             = { version = "0.3.47", features = ["formatting"] }
tokio            = { version = "1.52.2", features = ["full"] }
tokio-stream     = "0.1.18"
tower-http       = { version = "0.6.8", features = ["cors", "fs"] }
url              = "2.5.8"
uuid             = { version = "1.23.1", features = ["v4", "v5", "v7", "serde"] }
walkdir          = "2.5.0"
whatlang         = "0.18.0"
wildmatch        = "2.6.1"
xxhash-rust      = { version = "0.8.15", features = ["xxh32"] }
zip              = "8.6.0"
