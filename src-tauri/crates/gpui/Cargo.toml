[package]
name = "chatspeed-gpui"
version = "2.1.3"
edition = "2021"
publish = false

[features]
default = ["gui"]
gui = ["dep:alacritty_terminal", "dep:gpui-kit", "dep:image", "dep:rodio", "dep:raw-window-handle", "dep:x11rb", "dep:windows-sys", "dep:objc2-app-kit", "dep:tempfile"]

[[bin]]
name = "chatspeed-gpui"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false, optional = true }
chatspeed-runtime-client = { path = "../client" }
chatspeed-contracts = { path = "../contracts" }
base64 = "0.22"
gpui-kit = { version = "=0.10.0", features = ["syntect"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "4"
rodio = { version = "0.21.1", default-features = false, features = ["mp3", "playback"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
clap = { version = "4", features = ["derive"] }
locale_config = "0.3.0"
tempfile = { version = "3.27.0", optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "ico", "tiff"], optional = true }

raw-window-handle = { version = "0.6.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true }

[build-dependencies]
embed-resource = "3"
