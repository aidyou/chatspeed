[package]
name = "chatspeed-runtime"
version = "2.0.17"
edition = "2021"
publish = false
description = "Headless ChatSpeed control-plane runtime (no Tauri/Wry/GTK)."

# This package is the first independent runtime target. It deliberately does
# not depend on the desktop crate, `tauri`, `wry`, `gtk` or any Tauri plugin:
# the production dependency graph must stay desktop-free.
[lib]
name = "chatspeed_runtime"
path = "src/lib.rs"

[[bin]]
name = "chatspeed-runtime"
path = "src/main.rs"

[dependencies]
chatspeed-contracts = { path = "../../contracts", features = ["contracts-crate"] }
# The standalone runtime shares the client's Tauri-free path resolver so the
# runtime directory, database and application-data directory can never drift
# from what a client computed.
chatspeed-runtime-client = { path = "../client" }
# The canonical backend (database, chat/tool state, workflow hub, application
# service) is assembled from the shared, desktop-free modules instead of being
# re-implemented here; this is what makes the runtime serve the same routes as
# the desktop's in-process control plane.
chatspeed-runtime-backend = { path = "../backend" }
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4"
log = "0.4.29"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }

# Unix uses `kill(pid, 0)` to decide whether an existing lock owner is still
# alive; a lock that cannot be proven stale is never taken over.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["json"] }
tempfile = "3.27.0"
