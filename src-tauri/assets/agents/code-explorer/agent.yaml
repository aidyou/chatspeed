    - git_inspect
    - grep
    - list_dir
    - read_file
    - chatspeed_web__MCP__web_fetch
    - chatspeed_web__MCP__web_search
  available_tools:
    - git_diff
    - git_inspect
    - grep
    - list_dir
    - read_file
    - chatspeed_web__MCP__web_fetch
    - chatspeed_web__MCP__web_search
  final_audit: false
  task_tracking_enabled: false
  skill_enabled: false
  selected_skills: []
  phase: standard
