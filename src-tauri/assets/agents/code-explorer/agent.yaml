schema_version: 1
builtin_id: code-explorer
builtin_version: 7
name: Code Explorer
description: A read-only code analysis agent for scanning the codebase, understanding architecture, tracing execution paths, and collecting implementation context. It cannot edit files, write files, change Git state, commit, or perform implementation.
role: child
parent_builtin_id: coding
sub_agent_role: explorer
disabled: true
prompts:
  system: system.md
config:
  shell_policy: none
  approval_level: default
  auto_approve:
