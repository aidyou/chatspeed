[package]
name = "chatspeed-runtime-client"
version = "2.0.17"
edition = "2021"
publish = false
description = "Reusable control-plane runtime client shared by the desktop client and cscli (no Tauri/Wry/GTK)."

# This package is the client half of the runtime split: discovery lookup, bearer
# transport, stable error mapping and the lease lifecycle live here so `chatspeed`
# (Tauri), `cscli` and future clients speak the same loopback HTTP/JSON + SSE
# protocol instead of copying it. It deliberately does not depend on the desktop
# crate, `tauri`, `wry`, `gtk` or any Tauri plugin: the production dependency
# graph must stay desktop-free.
[lib]
name = "chatspeed_runtime_client"
path = "src/lib.rs"

[dependencies]
chatspeed-contracts = { path = "../contracts", features = ["contracts-crate"] }
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["macros", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
# Tests exercise real loopback sockets with a hand-written HTTP/1.1 fake
# server, so they need tokio's net/io-util runtime features.
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
